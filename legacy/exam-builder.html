<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Pack Builder</title>

    <style>
        :root {
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --border: #e2e8f0;
            --border-focus: #667eea;
            --text-main: #2c3e50;
            --text-muted: #4a5568;
            --primary: #667eea;
            --primary-hover: #5568d3;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #1abc9c;
            --success-hover: #16a085;
            --glass-blur: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-attachment: fixed;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            display: inline-block;
        }

        .version-badge {
            font-size: 0.75rem;
            background: #e2e8f0;
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
            vertical-align: middle;
            font-weight: 600;
        }

        header .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
        }

        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); transform: translateY(-1px); }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            padding: 2rem;
            flex-grow: 1;
            height: calc(100vh - 73px);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group-checkbox {
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .question-item {
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .question-item:hover {
            border-color: var(--text-muted);
        }

        .question-item.active {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .question-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-item-domain {
            font-size: 0.75rem;
            background: #e2e8f0;
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
            color: var(--text-muted);
        }

        .question-preview {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Editor Area */
        .editor-area {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-radius: 1rem;
        }

        .editor-area::-webkit-scrollbar { width: 8px; }
        .editor-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .choices-container {
            display: grid;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .choice-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .choice-row input[type="radio"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--success);
            cursor: pointer;
            flex-shrink: 0;
        }

        .choice-row input[type="text"] {
            flex-grow: 1;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px dashed var(--border);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Exam Pack Builder</h1>
            <span class="version-badge" id="app-version-badge">v2.0.0</span>
        </div>
        <div class="actions">
            <input type="file" id="import-file" accept=".json" class="hidden">
            <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Import
            </button>
            <button class="btn btn-success" onclick="exportExam()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export JSON
            </button>
        </div>
    </header>

    <main>
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="card">
                <div class="card-header">Exam Settings</div>
                <div class="form-group">
                    <label>Exam Name <span style="color: var(--danger);">*</span></label>
                    <input type="text" id="exam-name" oninput="updateExamConfig('Exam Name', this.value)" placeholder="e.g. CAT Demo Exam">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label title="How many questions to draw from the pool for a single test session">Questions per Test <span style="color: var(--danger);">*</span></label>
                        <input type="number" id="exam-total" oninput="updateExamConfig('Number of Questions', parseInt(this.value) || 0)">
                    </div>
                    <div class="form-group">
                        <label>Passing % <span style="color: var(--danger);">*</span></label>
                        <input type="number" id="exam-pass" min="1" max="100" oninput="updateExamConfig('percentPass', parseInt(this.value) || 0)">
                    </div>
                </div>
                <div class="form-row" id="cat-config-row" style="display: none;">
                    <div class="form-group">
                        <label title="Minimum questions for CAT">Min Questions <span style="color: var(--danger);">*</span></label>
                        <input type="number" id="exam-min" oninput="updateExamConfig('minQuestions', parseInt(this.value) || 0)">
                    </div>
                    <div class="form-group">
                        <label title="Locked to 'Questions per Test'">Max Questions <span style="color: var(--danger);">*</span></label>
                        <input type="number" id="exam-max" disabled style="opacity: 0.7; cursor: not-allowed;" title="Max Questions automatically matches Questions per Test">
                    </div>
                </div>
                <div class="form-group">
                    <label>Default Time limit (mins, 0 for off) <span style="color: var(--danger);">*</span></label>
                    <input type="number" id="exam-time" oninput="updateExamConfig('Default Time', parseInt(this.value) || 0)">
                </div>
                <div class="form-group">
                    <label>Instructions</label>
                    <textarea id="exam-instructions" oninput="updateExamConfig('Instructions', this.value)" placeholder="Exam Instructions"></textarea>
                </div>
                <div class="form-group" style="border: 1px solid var(--border); padding: 0.75rem; border-radius: 0.5rem; background: #f8fafc;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="margin: 0; color: var(--text-main);">Domain Percentages <span style="color: var(--danger);">*</span> <span id="domain-total-label" style="font-size:0.8rem; color:var(--text-muted); font-weight:normal; margin-left:8px;">(Total: 0%)</span></label>
                        <button type="button" class="btn btn-outline" style="padding: 0.2rem 0.4rem; font-size: 0.7rem; border-color: var(--border); color: var(--text-main);" onclick="addDomainPercentage()">+ Add</button>
                    </div>
                    <div id="domain-percentages-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="exam-cat" onchange="updateExamConfig('EnableCAT', this.checked)">
                    <label for="exam-cat">Enable Computer Adaptive Testing (CAT)</label>
                </div>
                <div class="form-group-checkbox">
                    <input type="checkbox" id="exam-nav" onchange="updateExamConfig('BackNavigation', this.checked)">
                    <label for="exam-nav">Allow Back Navigation</label>
                </div>
            </div>

            <div class="card" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="card-header">
                    <span id="question-count-label" style="font-size: 1rem;">Questions <span style="color: var(--danger);">*</span> (0)</span>
                    <button class="btn btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="addQuestion()">+ Add</button>
                </div>
                <div class="question-list" id="question-list">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </aside>

        <!-- Main Editor -->
        <section class="editor-area">
            <div id="empty-state" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <h2>No Question Selected</h2>
                <p>Select a question from the sidebar or add a new one to start editing.</p>
            </div>

            <div id="question-editor" class="card hidden">
                <div class="card-header">
                    <span>Edit Question</span>
                    <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="deleteCurrentQuestion()">Delete</button>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Domain of Knowledge</label>
                        <select id="q-domain" onchange="updateCurrentQuestion('DomainOfKnowledge', this.value)" style="width: 100%; border-radius: 0.5rem; padding: 0.6rem 0.75rem; border: 1px solid var(--border); font-family: inherit; font-size: 0.95rem; background: var(--bg-input); color: var(--text-main);"></select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty Level</label>
                        <select id="q-difficulty" onchange="updateCurrentQuestion('difficultyLevel', parseInt(this.value))" style="width: 100%; border-radius: 0.5rem; padding: 0.6rem 0.75rem; border: 1px solid var(--border); font-family: inherit; font-size: 0.95rem; background: var(--bg-input); color: var(--text-main);">
                            <option value="1">1 - Fundamental</option>
                            <option value="2">2 - Beginner</option>
                            <option value="3">3 - Novice</option>
                            <option value="4">4 - Intermediate</option>
                            <option value="5">5 - Proficient</option>
                            <option value="6">6 - Advanced</option>
                            <option value="7">7 - Hard</option>
                            <option value="8">8 - Very Hard</option>
                            <option value="9">9 - Expert</option>
                            <option value="10">10 - Insanely Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Question Text <span style="color: var(--danger);">*</span></label>
                    <textarea id="q-text" oninput="updateCurrentQuestion('Question', this.value)" placeholder="What is the question?"></textarea>
                </div>

                <div class="form-group">
                    <label>Choices (Select the correct answer) <span style="color: var(--danger);">*</span></label>
                    <div class="choices-container" id="choices-container">
                        <!-- Dynamically generated -->
                    </div>
                    <button type="button" class="btn btn-primary" style="margin-top: 0.5rem; width: fit-content; padding: 0.4rem 0.6rem; font-size: 0.85rem;" onclick="addChoice()">+ Add Choice</button>
                </div>

                <div class="form-group">
                    <label>Explanation <span style="color: var(--danger);">*</span></label>
                    <textarea id="q-explanation" oninput="updateCurrentQuestion('Explanation', this.value)" placeholder="Explain why the answer is correct..."></textarea>
                </div>

            </div>
        </section>
    </main>

    <script>
        const APP_VERSION = "2.0.1";
        const INTERNAL_VERSION = "20260419001";
        
        document.getElementById('app-version-badge').textContent = `v${APP_VERSION}`;

        // State
        let examData = {
            "Exam Name": "New Exam Pack",
            "EnableCAT": false,
            "minQuestions": 10,
            "maxQuestions": 30,
            "percentPass": 70,
            "Number of Questions": 50,
            "Default Time": 0,
            "BackNavigation": false,
            "Instructions": "",
            "DomainPercentages": {},
            "Questions": []
        };
        let currentQuestionIndex = -1;

        // Initialize empty state
        renderExamConfig();
        renderQuestionList();
        updateEditorView();

        // Exam Config Form Bindings
        function renderExamConfig() {
            document.getElementById('exam-name').value = examData["Exam Name"] || '';
            document.getElementById('exam-total').value = examData["Number of Questions"] || 0;
            document.getElementById('exam-pass').value = examData["percentPass"] || 0;
            
            examData["maxQuestions"] = examData["Number of Questions"];
            
            document.getElementById('exam-min').value = examData["minQuestions"] || 0;
            document.getElementById('exam-max').value = examData["maxQuestions"] || 0;
            document.getElementById('exam-time').value = examData["Default Time"] || 0;
            document.getElementById('exam-instructions').value = examData["Instructions"] || '';
            
            const isCat = !!examData["EnableCAT"];
            document.getElementById('exam-cat').checked = isCat;
            
            const catRow = document.getElementById('cat-config-row');
            if (catRow) catRow.style.display = isCat ? 'grid' : 'none';
            
            document.getElementById('exam-nav').checked = !!examData["BackNavigation"];
            renderDomainPercentages();
        }

        function renderDomainPercentages() {
            const list = document.getElementById('domain-percentages-list');
            list.innerHTML = '';
            if(!examData["DomainPercentages"]) {
                examData["DomainPercentages"] = {};
            }
            
            Object.entries(examData["DomainPercentages"]).forEach(([domain, percent]) => {
                const row = document.createElement('div');
                row.style = 'display: flex; gap: 0.25rem; align-items: center;';
                row.innerHTML = `
                    <input type="text" value="${domain.replace(/"/g, '&quot;')}" onchange="updateDomainName('${domain.replace(/'/g, "\\'")}', this.value)" style="flex-grow: 1; padding: 0.3rem 0.5rem; font-size: 0.8rem;" placeholder="Domain">
                    <input type="number" value="${percent}" oninput="updateDomainPercent('${domain.replace(/'/g, "\\'")}', parseInt(this.value) || 0)" style="width: 60px; padding: 0.3rem 0.5rem; font-size: 0.8rem;">
                    <button type="button" class="btn btn-danger" style="padding: 0.3rem;" onclick="removeDomainPercentage('${domain.replace(/'/g, "\\'")}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                list.appendChild(row);
            });
            updateDomainTotalUI();
        }

        function updateDomainTotalUI() {
            let total = 0;
            if(examData["DomainPercentages"]) {
                for(let key in examData["DomainPercentages"]) {
                    total += examData["DomainPercentages"][key];
                }
            }
            const label = document.getElementById('domain-total-label');
            if(label) {
                label.textContent = `(Total: ${total}%)`;
                label.style.color = total > 100 ? 'var(--danger)' : 'var(--text-muted)';
            }
        }

        function updateDomainName(oldDomain, newDomain) {
            oldDomain = (oldDomain || "").trim();
            newDomain = (newDomain || "").trim();
            if(oldDomain === newDomain || !newDomain) return;
            
            const percent = examData["DomainPercentages"][oldDomain];
            delete examData["DomainPercentages"][oldDomain];
            examData["DomainPercentages"][newDomain] = percent;
            
            // Mass rename in questions
            if(examData.Questions) {
                examData.Questions.forEach(q => {
                    if (q.DomainOfKnowledge && q.DomainOfKnowledge.trim() === oldDomain) {
                        q.DomainOfKnowledge = newDomain;
                    }
                });
            }

            renderDomainPercentages();
            renderQuestionList();
            updateEditorView();
        }

        function updateDomainPercent(domain, percent) {
            examData["DomainPercentages"][domain] = percent;
            updateDomainTotalUI();
        }

        function removeDomainPercentage(domain) {
            delete examData["DomainPercentages"][domain];
            renderDomainPercentages();
        }

        function addDomainPercentage() {
            if(!examData["DomainPercentages"]) examData["DomainPercentages"] = {};
            
            let currentSum = 0;
            for(let key in examData["DomainPercentages"]) {
                currentSum += examData["DomainPercentages"][key];
            }
            let remaining = 100 - currentSum;
            if(remaining < 0) remaining = 0;
            
            let baseName = "New Domain";
            let name = baseName;
            let counter = 1;
            while(examData["DomainPercentages"].hasOwnProperty(name)) {
                name = baseName + " " + counter;
                counter++;
            }
            
            examData["DomainPercentages"][name] = remaining;
            renderDomainPercentages();
        }

        function updateExamConfig(key, value) {
            if (key === 'minQuestions') {
                const maxAllowed = examData.maxQuestions || examData["Number of Questions"] || 0;
                if (value > maxAllowed) {
                    value = maxAllowed;
                    const minEl = document.getElementById('exam-min');
                    if(minEl) minEl.value = value;
                }
                if (value < 1) {
                    value = 1;
                    const minEl = document.getElementById('exam-min');
                    if(minEl) minEl.value = value;
                }
            }

            if (key === 'percentPass') {
                if (value > 100) {
                    value = 100;
                    const passEl = document.getElementById('exam-pass');
                    if(passEl) passEl.value = 100;
                }
            }

            examData[key] = value;
            
            if (key === 'Number of Questions') {
                examData.maxQuestions = value;
                const maxEl = document.getElementById('exam-max');
                if (maxEl) maxEl.value = value;
                
                // Auto-clamp minQuestions if new max shrinks below it
                if (examData.EnableCAT && (examData.minQuestions || 0) > value) {
                    examData.minQuestions = value;
                    const minEl = document.getElementById('exam-min');
                    if (minEl) minEl.value = value;
                }
            }
            if (key === 'EnableCAT') {
                const catRow = document.getElementById('cat-config-row');
                if (catRow) catRow.style.display = value ? 'grid' : 'none';
            }
        }

        function addQuestion() {
            if (!examData["DomainPercentages"] || Object.keys(examData["DomainPercentages"]).length === 0) {
                examData["DomainPercentages"] = { "General": 100 };
                renderDomainPercentages();
            }
            
            const firstDomain = Object.keys(examData["DomainPercentages"])[0] || "General";

            const newQ = {
                "DomainOfKnowledge": firstDomain,
                "Question": "New Question",
                "Choices": ["", ""],
                "AnswerKey": "",
                "Explanation": "",
                "difficultyLevel": 1
            };
            examData.Questions.push(newQ);
            selectQuestion(examData.Questions.length - 1);
            renderQuestionList();
        }

        function selectQuestion(index) {
            currentQuestionIndex = index;
            renderQuestionList();
            updateEditorView();
        }

        function deleteCurrentQuestion() {
            if(currentQuestionIndex > -1 && confirm('Are you sure you want to delete this question?')) {
                examData.Questions.splice(currentQuestionIndex, 1);
                currentQuestionIndex = -1;
                renderQuestionList();
                updateEditorView();
            }
        }

        function renderQuestionList() {
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            
            const count = examData.Questions.length;
            const countLabel = document.getElementById('question-count-label');
            if (countLabel) {
                let text = `Questions <span style="color: var(--danger);">*</span> (${count})`;
                let color = "inherit";
                let title = "";
                
                if (count >= 10000) {
                    text += ' <span style="font-size: 0.75rem;">⚠️ Performance may drop</span>';
                    color = "var(--danger)";
                    title = "Over 10000 questions may cause browser lag. Processing limits reached.";
                } else if (count >= 5000) {
                    text += ' <span style="font-size: 0.75rem;">⚠️ Approaching limits</span>';
                    color = "#eab308";
                    title = "Over 5000 questions. The editor might begin to slow down.";
                }
                
                countLabel.innerHTML = text;
                countLabel.style.color = color;
                countLabel.title = title;
            }

            examData.Questions.forEach((q, index) => {
                const el = document.createElement('div');
                el.className = `question-item ${index === currentQuestionIndex ? 'active' : ''}`;
                el.onclick = () => selectQuestion(index);
                
                el.innerHTML = `
                    <div class="question-item-header">
                        <strong>Q${index + 1}</strong>
                        <span class="question-item-domain">${q.difficultyLevel} • ${q.DomainOfKnowledge || 'No Domain'}</span>
                    </div>
                    <div class="question-preview">${q.Question || '<em>Empty question</em>'}</div>
                `;
                list.appendChild(el);
            });
        }

        // Editor Actions
        function updateEditorView() {
            const editor = document.getElementById('question-editor');
            const emptyState = document.getElementById('empty-state');
            
            if (currentQuestionIndex === -1 || !examData.Questions[currentQuestionIndex]) {
                editor.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            editor.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const q = examData.Questions[currentQuestionIndex];
            
            // Populate select options
            const domainSelect = document.getElementById('q-domain');
            domainSelect.innerHTML = '';
            
            const availableDomains = Object.keys(examData["DomainPercentages"] || {});
            const currentDom = q.DomainOfKnowledge || '';
            
            // Add existing domains from setup
            availableDomains.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                domainSelect.appendChild(opt);
            });
            
            // If question has a domain not in the UI, ensure it's still selectable
            if (currentDom && !availableDomains.includes(currentDom)) {
                const opt = document.createElement('option');
                opt.value = currentDom;
                opt.textContent = currentDom + " (Not in Settings)";
                domainSelect.appendChild(opt);
            }
            
            domainSelect.value = currentDom;
            document.getElementById('q-difficulty').value = q.difficultyLevel || 1;
            document.getElementById('q-text').value = q.Question || '';
            document.getElementById('q-explanation').value = q.Explanation || '';

            // Dynamically render choices
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            q.Choices.forEach((choice, index) => {
                const choiceRow = document.createElement('div');
                choiceRow.className = 'choice-row';
                choiceRow.style.display = 'flex';
                choiceRow.style.alignItems = 'center';
                choiceRow.style.gap = '8px';
                choiceRow.style.marginBottom = '8px';
                
                const isSelected = (q.AnswerKey !== "" && q.AnswerKey === choice && choice.trim() !== "");
                
                choiceRow.innerHTML = `
                    <input type="radio" name="answer" value="${index}" id="ans-${index}" onchange="updateCorrectAnswer(${index})" ${isSelected ? 'checked' : ''} title="Mark as correct answer">
                    <input type="text" id="choice-${index}" oninput="updateChoice(${index}, this.value)" placeholder="Choice ${index + 1}" value="${choice.replace(/"/g, '&quot;')}" style="flex-grow: 1; border-radius: 0.25rem; padding: 0.4rem; border: 1px solid var(--border);">
                    <button type="button" class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="removeChoice(${index})" title="Remove choice">&times;</button>
                `;
                choicesContainer.appendChild(choiceRow);
            });
        }

        function addChoice() {
            if (currentQuestionIndex > -1) {
                examData.Questions[currentQuestionIndex].Choices.push("");
                updateEditorView();
            }
        }

        function removeChoice(index) {
            if (currentQuestionIndex > -1) {
                examData.Questions[currentQuestionIndex].Choices.splice(index, 1);
                updateEditorView();
            }
        }

        function updateCurrentQuestion(key, value) {
            if (currentQuestionIndex > -1) {
                examData.Questions[currentQuestionIndex][key] = value;
                // re-render list if key affects preview
                if (['Question', 'DomainOfKnowledge', 'difficultyLevel'].includes(key)) {
                    renderQuestionList();
                }
            }
        }

        function updateChoice(index, value) {
            if (currentQuestionIndex > -1) {
                const q = examData.Questions[currentQuestionIndex];
                
                // If this choice was previously the AnswerKey, update the AnswerKey to match new value
                const isCorrectAnswer = document.getElementById(`ans-${index}`).checked;
                
                q.Choices[index] = value;
                
                if (isCorrectAnswer) {
                    q.AnswerKey = value;
                }
            }
        }

        function updateCorrectAnswer(index) {
            if (currentQuestionIndex > -1) {
                const choiceVal = document.getElementById(`choice-${index}`).value;
                examData.Questions[currentQuestionIndex].AnswerKey = choiceVal;
            }
        }

        // Import / Export
        function exportExam() {
            // Extensive Validation Before Export
            if (!examData["Exam Name"] || examData["Exam Name"].trim() === "") {
                alert("Validation Error: Exam Name cannot be empty.");
                return;
            }

            let requiredTestQs = examData["Number of Questions"];
            if (requiredTestQs <= 0) {
                alert("Validation Error: Questions per Test must be greater than 0.");
                return;
            }

            const totalBankQs = examData.Questions.length;
            if (totalBankQs === 0) {
                alert("Validation Error: The exam bank has no questions. Add some before exporting.");
                return;
            }

            // Validate all questions have required fields
            for (let i = 0; i < totalBankQs; i++) {
                const q = examData.Questions[i];
                if (!q.Question || q.Question.trim() === "") {
                    alert("Validation Error: Question #" + (i + 1) + " has empty question text.");
                    selectQuestion(i); // Jump to it
                    return;
                }
                const validChoices = q.Choices.filter(c => c && c.trim() !== "");
                if (validChoices.length < 2) {
                    alert("Validation Error: Question #" + (i + 1) + " must have at least 2 valid choices.");
                    selectQuestion(i);
                    return;
                }
                if (!q.AnswerKey || q.AnswerKey.trim() === "" || !validChoices.includes(q.AnswerKey)) {
                    alert("Validation Error: Question #" + (i + 1) + " does not have a valid correct answer selected. (Make sure you clicked the radio button next to your answer)");
                    selectQuestion(i);
                    return;
                }
                if (!q.Explanation || q.Explanation.trim() === "") {
                    alert("Validation Error: Question #" + (i + 1) + " is missing an Explanation. This field is strictly required by the exam application.");
                    selectQuestion(i);
                    return;
                }
            }

            if (examData.percentPass <= 0 || examData.percentPass > 100) {
                alert("Validation Error: Passing % must be between 1 and 100.");
                return;
            }

            if (examData.EnableCAT) {
                if (examData.minQuestions <= 0) {
                    alert("Validation Error: CAT Min Questions must be greater than 0.");
                    return;
                }
                if (examData.maxQuestions < examData.minQuestions) {
                    alert("Validation Error: CAT Max Questions cannot be less than Min Questions.");
                    return;
                }
                requiredTestQs = examData.maxQuestions;
            }

            if (totalBankQs < requiredTestQs) {
                alert("Validation Error: Number of questions in bank (" + totalBankQs + ") must be greater than or equal to the total required per test draw (" + requiredTestQs + ").");
                return;
            }

            // Validate Domains
            let totalPercent = 0;
            const domainCounts = {};
            examData.Questions.forEach(q => {
                const dom = (q.DomainOfKnowledge || "").trim();
                domainCounts[dom] = (domainCounts[dom] || 0) + 1;
            });

            if(examData["DomainPercentages"] && Object.keys(examData["DomainPercentages"]).length > 0) {
                for(let key in examData["DomainPercentages"]) {
                    let percent = examData["DomainPercentages"][key];
                    totalPercent += percent;

                    let requiredForDomain = Math.ceil(requiredTestQs * (percent / 100));
                    let actualInBank = domainCounts[key.trim()] || 0;
                    if (actualInBank < requiredForDomain) {
                        alert("Validation Error: Domain '" + key + "' targets " + percent + "% of the test (" + requiredForDomain + " Qs). The active bank only has " + actualInBank + " Qs matching this domain.");
                        return;
                    }
                }
                if (totalPercent > 100) {
                    alert("Validation Error: Total Domain Percentages exceed 100%. Please adjust before exporting.");
                    return;
                }
            }

            // Before export, ensure schema is fully obeyed
            const cleanData = JSON.parse(JSON.stringify(examData));
            cleanData.Questions.forEach(q => {
                // Remove empty strings from choices prior to JSON generation
                q.Choices = q.Choices.filter(c => c && c.trim() !== "");
            });
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href",     dataStr);
            let fn = cleanData["Exam Name"].replace(/[^a-z0-9]/gi, '_').toLowerCase();
            if (!fn) fn = 'exam_pack';
            downloadAnchorNode.setAttribute("download", fn + ".json");
            document.body.appendChild(downloadAnchorNode); // required for firefox
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    // Minimal validation
                    if(parsed["Questions"] && Array.isArray(parsed["Questions"])) {
                        
                        // Backwards compatibility migration for misspelled Explaination
                        parsed.Questions.forEach(q => {
                            if (q && typeof q === 'object' && 'Explaination' in q) {
                                q.Explanation = q.Explaination;
                                delete q.Explaination;
                            }
                        });

                        examData = parsed;
                        currentQuestionIndex = -1;
                        renderExamConfig();
                        renderQuestionList();
                        updateEditorView();
                    } else {
                        alert("Invalid exam JSON format: 'Questions' missing.");
                    }
                } catch (err) {
                    alert("Error parsing JSON: " + err.message);
                }
            };
            reader.readAsText(file);
            // Reset input so importing same file again works
            e.target.value = null;
        });
    </script>
</body>
